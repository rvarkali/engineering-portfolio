<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1420" viewBox="0 0 1000 1420" role="img" aria-labelledby="title description">
  <title id="title">Implemented document-read authorization path</title>
  <desc id="description">A client request passes through Spring Security, PostgreSQL identity and tenant checks, OpenFGA can_view evaluation, and OPA contextual policy. Denial or dependency failure stops the request.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#1769ff"/>
    </marker>
    <marker id="stopArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#b42318"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f2d58" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="1000" height="1420" rx="28" fill="#f7f9fc"/>
  <text x="500" y="60" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#071126">Document-read authorization</text>
  <text x="500" y="94" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" fill="#687792">Implemented request path and stop conditions</text>

  <g font-family="Inter, Arial, sans-serif" filter="url(#shadow)">
    <rect x="90" y="130" width="570" height="112" rx="18" fill="#ffffff" stroke="#bcd3ff" stroke-width="2"/>
    <text x="375" y="177" text-anchor="middle" font-size="25" font-weight="700" fill="#071126">Client request</text>
    <text x="375" y="211" text-anchor="middle" font-size="19" fill="#34445e">GET /api/v1/documents/{documentId}</text>

    <rect x="90" y="300" width="570" height="112" rx="18" fill="#ffffff" stroke="#bcd3ff" stroke-width="2"/>
    <text x="375" y="347" text-anchor="middle" font-size="25" font-weight="700" fill="#071126">Spring Security</text>
    <text x="375" y="381" text-anchor="middle" font-size="19" fill="#34445e">Validate JWT signature, issuer, time and audience</text>

    <rect x="90" y="470" width="570" height="112" rx="18" fill="#ffffff" stroke="#bcd3ff" stroke-width="2"/>
    <text x="375" y="517" text-anchor="middle" font-size="25" font-weight="700" fill="#071126">PostgreSQL identity</text>
    <text x="375" y="551" text-anchor="middle" font-size="19" fill="#34445e">Resolve exactly one active internal principal</text>

    <rect x="90" y="640" width="570" height="132" rx="18" fill="#ffffff" stroke="#bcd3ff" stroke-width="2"/>
    <text x="375" y="689" text-anchor="middle" font-size="25" font-weight="700" fill="#071126">PostgreSQL eligibility</text>
    <text x="375" y="723" text-anchor="middle" font-size="19" fill="#34445e">Load resource and authoritative tenant context</text>
    <text x="375" y="750" text-anchor="middle" font-size="19" fill="#34445e">Require active tenant membership</text>

    <rect x="90" y="830" width="570" height="112" rx="18" fill="#ffffff" stroke="#bcd3ff" stroke-width="2"/>
    <text x="375" y="877" text-anchor="middle" font-size="25" font-weight="700" fill="#071126">OpenFGA</text>
    <text x="375" y="911" text-anchor="middle" font-size="19" fill="#34445e">Evaluate computed can_view permission</text>

    <rect x="90" y="1000" width="570" height="112" rx="18" fill="#ffffff" stroke="#bcd3ff" stroke-width="2"/>
    <text x="375" y="1047" text-anchor="middle" font-size="25" font-weight="700" fill="#071126">OPA</text>
    <text x="375" y="1081" text-anchor="middle" font-size="19" fill="#34445e">Evaluate backend-built contextual policy</text>

    <rect x="90" y="1170" width="570" height="112" rx="18" fill="#eaf8ef" stroke="#69b983" stroke-width="2"/>
    <text x="375" y="1217" text-anchor="middle" font-size="25" font-weight="700" fill="#12622e">200 OK</text>
    <text x="375" y="1251" text-anchor="middle" font-size="19" fill="#285b39">Return the authorized document</text>

    <rect x="710" y="570" width="240" height="252" rx="18" fill="#fff3f2" stroke="#e59b94" stroke-width="2"/>
    <text x="830" y="622" text-anchor="middle" font-size="25" font-weight="700" fill="#8f1d14">Stop request</text>
    <text x="830" y="663" text-anchor="middle" font-size="18" fill="#5f2a25">Authentication failure,</text>
    <text x="830" y="692" text-anchor="middle" font-size="18" fill="#5f2a25">ineligibility, denial or</text>
    <text x="830" y="721" text-anchor="middle" font-size="18" fill="#5f2a25">recognized dependency</text>
    <text x="830" y="750" text-anchor="middle" font-size="18" fill="#5f2a25">failure ends evaluation.</text>
    <text x="830" y="792" text-anchor="middle" font-size="17" font-weight="700" fill="#8f1d14">No document returned</text>
  </g>

  <g fill="none" stroke="#1769ff" stroke-width="4" marker-end="url(#arrow)">
    <path d="M375 242 V294"/>
    <path d="M375 412 V464"/>
    <path d="M375 582 V634"/>
    <path d="M375 772 V824"/>
    <path d="M375 942 V994"/>
    <path d="M375 1112 V1164"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1769ff">
    <text x="396" y="276">valid</text>
    <text x="396" y="446">resolved</text>
    <text x="396" y="616">found</text>
    <text x="396" y="806">eligible</text>
    <text x="396" y="976">ALLOW</text>
    <text x="396" y="1146">ALLOW</text>
  </g>

  <g fill="none" stroke="#b42318" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#stopArrow)">
    <path d="M660 356 H685 V610 H704"/>
    <path d="M660 526 H690 V650 H704"/>
    <path d="M660 706 H704"/>
    <path d="M660 886 H685 V746 H704"/>
    <path d="M660 1056 H694 V786 H704"/>
  </g>
  <text x="500" y="1360" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#687792">HTTP 401, 403, 404 and 503 outcomes are detailed in the article.</text>
</svg>
