<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180" role="img" aria-labelledby="title description">
  <title id="title">PostgreSQL and OpenFGA consistency boundary</title>
  <desc id="description">The implemented request path uses PostgreSQL for authoritative application facts, OpenFGA for relationship decisions and OPA for contextual policy without a shared PostgreSQL and OpenFGA transaction. A separate proposed section shows an outbox, idempotent projection, reconciliation and monitoring.</desc>
  <defs>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#1769ff"/>
    </marker>
    <marker id="amberArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#b76b00"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0f2d58" flood-opacity="0.09"/>
    </filter>
  </defs>
  <rect width="1200" height="1180" rx="28" fill="#f7f9fc"/>
  <text x="600" y="55" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#071126">Authorization consistency boundary</text>

  <rect x="45" y="90" width="1110" height="600" rx="24" fill="#eef5ff" stroke="#8db6ff" stroke-width="2"/>
  <text x="80" y="137" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#104eb5">IMPLEMENTED — CURRENT REQUEST PATH</text>

  <g font-family="Inter, Arial, sans-serif" filter="url(#shadow)">
    <rect x="390" y="175" width="420" height="104" rx="18" fill="#ffffff" stroke="#bcd3ff" stroke-width="2"/>
    <text x="600" y="218" text-anchor="middle" font-size="25" font-weight="700" fill="#071126">Spring Boot API</text>
    <text x="600" y="250" text-anchor="middle" font-size="18" fill="#34445e">Authorization enforcement and ordering</text>

    <rect x="90" y="365" width="300" height="165" rx="18" fill="#ffffff" stroke="#bcd3ff" stroke-width="2"/>
    <text x="240" y="410" text-anchor="middle" font-size="25" font-weight="700" fill="#071126">PostgreSQL</text>
    <text x="240" y="446" text-anchor="middle" font-size="18" fill="#34445e">Principals and membership</text>
    <text x="240" y="475" text-anchor="middle" font-size="18" fill="#34445e">Resource and tenant facts</text>
    <text x="240" y="504" text-anchor="middle" font-size="18" fill="#34445e">Classification</text>

    <rect x="450" y="365" width="300" height="165" rx="18" fill="#ffffff" stroke="#bcd3ff" stroke-width="2"/>
    <text x="600" y="410" text-anchor="middle" font-size="25" font-weight="700" fill="#071126">OpenFGA</text>
    <text x="600" y="446" text-anchor="middle" font-size="18" fill="#34445e">Owner / editor / viewer</text>
    <text x="600" y="475" text-anchor="middle" font-size="18" fill="#34445e">Computed permissions</text>
    <text x="600" y="504" text-anchor="middle" font-size="18" fill="#34445e">Relationship decision</text>

    <rect x="810" y="365" width="300" height="165" rx="18" fill="#ffffff" stroke="#bcd3ff" stroke-width="2"/>
    <text x="960" y="410" text-anchor="middle" font-size="25" font-weight="700" fill="#071126">OPA</text>
    <text x="960" y="446" text-anchor="middle" font-size="18" fill="#34445e">Backend-built context</text>
    <text x="960" y="475" text-anchor="middle" font-size="18" fill="#34445e">Classification policy</text>
    <text x="960" y="504" text-anchor="middle" font-size="18" fill="#34445e">Additional decision gate</text>

    <rect x="370" y="580" width="460" height="72" rx="16" fill="#fff3f2" stroke="#e59b94" stroke-width="2"/>
    <text x="600" y="611" text-anchor="middle" font-size="21" font-weight="700" fill="#8f1d14">No shared PostgreSQL / OpenFGA transaction</text>
    <text x="600" y="638" text-anchor="middle" font-size="17" fill="#5f2a25">A cross-system stale-state window can exist.</text>
  </g>

  <g fill="none" stroke="#1769ff" stroke-width="4" marker-end="url(#blueArrow)">
    <path d="M510 279 C460 320 350 322 270 359"/>
    <path d="M600 279 V359"/>
    <path d="M690 279 C740 320 850 322 930 359"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#1769ff">
    <text x="280" y="320">authoritative facts</text>
    <text x="617" y="329">relationships</text>
    <text x="841" y="320">after OpenFGA ALLOW</text>
  </g>
  <path d="M390 540 C455 575 505 576 560 575" fill="none" stroke="#b42318" stroke-width="3" stroke-dasharray="9 8"/>
  <path d="M750 540 C685 575 650 576 640 575" fill="none" stroke="#b42318" stroke-width="3" stroke-dasharray="9 8"/>

  <rect x="45" y="735" width="1110" height="395" rx="24" fill="#fff8e8" stroke="#e6ad52" stroke-width="2"/>
  <text x="80" y="782" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#8a4f00">PROPOSED PRODUCTION IMPROVEMENTS — NOT IMPLEMENTED</text>

  <g font-family="Inter, Arial, sans-serif" filter="url(#shadow)">
    <rect x="80" y="850" width="290" height="150" rx="18" fill="#ffffff" stroke="#e6ad52" stroke-width="2"/>
    <text x="225" y="897" text-anchor="middle" font-size="23" font-weight="700" fill="#071126">Durable change record</text>
    <text x="225" y="933" text-anchor="middle" font-size="18" fill="#34445e">Transactional outbox</text>
    <text x="225" y="962" text-anchor="middle" font-size="18" fill="#34445e">or equivalent mechanism</text>

    <rect x="455" y="850" width="290" height="150" rx="18" fill="#ffffff" stroke="#e6ad52" stroke-width="2"/>
    <text x="600" y="897" text-anchor="middle" font-size="23" font-weight="700" fill="#071126">Relationship projection</text>
    <text x="600" y="933" text-anchor="middle" font-size="18" fill="#34445e">Idempotent tuple updates</text>
    <text x="600" y="962" text-anchor="middle" font-size="18" fill="#34445e">and reconciliation</text>

    <rect x="830" y="850" width="290" height="150" rx="18" fill="#ffffff" stroke="#e6ad52" stroke-width="2"/>
    <text x="975" y="897" text-anchor="middle" font-size="23" font-weight="700" fill="#071126">Synchronization signals</text>
    <text x="975" y="933" text-anchor="middle" font-size="18" fill="#34445e">Lag, failure and drift</text>
    <text x="975" y="962" text-anchor="middle" font-size="18" fill="#34445e">monitoring</text>
  </g>
  <g fill="none" stroke="#b76b00" stroke-width="4" marker-end="url(#amberArrow)">
    <path d="M370 925 H449"/>
    <path d="M745 925 H824"/>
  </g>
  <text x="600" y="1080" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6b4a17">These components are architectural recommendations, not current repository capabilities.</text>
</svg>
